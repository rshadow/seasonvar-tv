name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    env:
      GRADLE_ARGS: --no-daemon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.language == 'java-kotlin'
        with:
          path: |
            .tools
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: security-gradle-${{ runner.os }}-${{ hashFiles('toolchain.lock.json', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: security-gradle-${{ runner.os }}-
      - name: Prepare pinned Android tools
        if: matrix.language == 'java-kotlin'
        run: make ci-tools
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build Kotlin, Java and signing tool for analysis
        if: matrix.language == 'java-kotlin'
        run: make codeql-build
      - name: Analyze
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          category: /language:${{ matrix.language }}
