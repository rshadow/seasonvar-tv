name: Publish dependency graph

on:
  workflow_run:
    workflows: [Dependency graph]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  submit:
    name: Publish dependency graph
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Submit saved graph without checking out or executing PR code
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: download-and-submit
          cache-provider: external
