name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GRADLE_ARGS: --no-daemon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ runner.os }}-${{ hashFiles('toolchain.lock.json', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Validate workflow
        run: make ci-lint
      - name: Prepare build tools and dependencies
        run: make ci-prepare
      - name: Build, test and lint
        run: make check
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seasonvar-tv-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build optimized test APK
        if: github.event_name == 'pull_request'
        run: make build-profile
      - name: Upload optimized test APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seasonvar-tv-profile
          path: app/build/outputs/apk/profile/app-profile.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build signed APK
        if: github.event_name != 'pull_request'
        env:
          SIGNING_ENV: ${{ secrets.SEASONVAR_SIGNING_ENV }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          python3 - <<'PYCI'
          import os
          value = os.environ.get("SIGNING_ENV", "")
          if not value.strip():
              raise SystemExit("Add repository secret SEASONVAR_SIGNING_ENV before building a signed APK")
          descriptor = os.open("secrets.env", os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "w") as stream:
              stream.write(value)
          PYCI
          unset SIGNING_ENV
          make release-package
      - name: Remove signing settings
        if: always()
        run: rm -f -- secrets.env
      - name: Upload signed APK and checksum
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seasonvar-tv-release
          path: |
            build/release/*.apk
            build/release/SHA256SUMS
            build/release/NOTES.md
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: seasonvar-tv-release
          path: release
      - name: Verify checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish GitHub Release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" ./*.apk ./SHA256SUMS \
            --verify-tag --notes-file NOTES.md --title "Seasonvar TV $RELEASE_TAG" "${options[@]}"
