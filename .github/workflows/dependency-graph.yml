name: Dependency graph

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-graph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  graph:
    name: Dependency graph
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: security-gradle-${{ runner.os }}-${{ hashFiles('toolchain.lock.json', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: security-gradle-${{ runner.os }}-
      - name: Prepare pinned Android tools
        run: make ci-tools ci-export-env
      - name: Generate dependency graph without repository write access
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: generate-and-upload
          cache-provider: external
          additional-arguments: --no-daemon --no-configuration-cache
